services:
  kafka:
    image: confluentinc/cp-kafka:7.5.1
    container_name: kafka
    environment:
      # KRaft конфигурация
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Listeners: один для клиентов SSL, один для контроллера (внутренний)
      KAFKA_LISTENERS: SSL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: SSL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: SSL:SSL,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: SSL

      # Репликация
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      CLUSTER_ID: "OoJJjKEFQYqF_yb5YlHSHQ"

      KAFKA_SSL_KEYSTORE_FILENAME: kafka.jks
      KAFKA_SSL_KEYSTORE_CREDENTIALS: ssl_creds
      KAFKA_SSL_KEY_CREDENTIALS: ssl_creds
      KAFKA_SSL_TRUSTSTORE_FILENAME: truststore.jks
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: ssl_creds
      KAFKA_SSL_CLIENT_AUTH: required 
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: "" 

    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./ssl:/etc/kafka/secrets:ro
    ports:
      - "9092:9092"
    networks:
      - localnet
    healthcheck:
      test: [ "CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:9092", "--command-config", "/etc/kafka/secrets/client.properties" ]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_DB: transactions_db
      POSTGRES_USER: debezium
      POSTGRES_PASSWORD: dbz
    command: >
      postgres -c wal_level=logical -c max_wal_senders=10 -c max_replication_slots=10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - localnet
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U debezium -d transactions_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  connect:
    image: debezium/connect:3.0.0.Final
    container_name: connect
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_status

      # Producer/Consumer SSL конфигурация
      CONNECT_SECURITY_PROTOCOL: SSL
      CONNECT_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/truststore.jks
      CONNECT_SSL_TRUSTSTORE_PASSWORD: changeit
      CONNECT_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/kafka.jks
      CONNECT_SSL_KEYSTORE_PASSWORD: changeit
      CONNECT_SSL_KEY_PASSWORD: changeit
      CONNECT_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: ""

      # Producer SSL конфигурация
      CONNECT_PRODUCER_SECURITY_PROTOCOL: SSL
      CONNECT_PRODUCER_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/truststore.jks
      CONNECT_PRODUCER_SSL_TRUSTSTORE_PASSWORD: changeit
      CONNECT_PRODUCER_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/kafka.jks
      CONNECT_PRODUCER_SSL_KEYSTORE_PASSWORD: changeit
      CONNECT_PRODUCER_SSL_KEY_PASSWORD: changeit
      CONNECT_PRODUCER_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: ""

      # Consumer SSL конфигурация
      CONNECT_CONSUMER_SECURITY_PROTOCOL: SSL
      CONNECT_CONSUMER_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/truststore.jks
      CONNECT_CONSUMER_SSL_TRUSTSTORE_PASSWORD: changeit
      CONNECT_CONSUMER_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/kafka.jks
      CONNECT_CONSUMER_SSL_KEYSTORE_PASSWORD: changeit
      CONNECT_CONSUMER_SSL_KEY_PASSWORD: changeit
      CONNECT_CONSUMER_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: ""

    volumes:
      - ./ssl:/etc/kafka/secrets:ro
    networks:
      - localnet

  app:
    build: .
    container_name: app
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      connect:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SECURITY_PROTOCOL: SSL
      KAFKA_SSL_CA_LOCATION: /etc/kafka/secrets/ca-cert.pem
      KAFKA_SSL_CERT_LOCATION: /etc/kafka/secrets/kafka-cert.pem
      KAFKA_SSL_KEY_LOCATION: /etc/kafka/secrets/kafka-key-nopass.pem
      DEBEZIUM_TRANSACTION_TOPIC: fraud-detection.public.transaction
      FRAUD_RESULTS_TOPIC: fraud-detection-results
      FRAUD_STREAM_RESULTS_TOPIC: fraud-detection-stream-results
    volumes:
      - ./ssl:/etc/kafka/secrets:ro
    ports:
      - "8080:8080"
    networks:
      - localnet

volumes:
  kafka-data:
  postgres-data:


networks:
  localnet:
    driver: bridge
